services:
  - type: web
    name: smart-coins-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false   # set this in the Render dashboard, not in git
      - key: MONGODB_DB
        value: smart_coins
      - key: WHATSAPP_COUNTRY_CODE
        value: "91"
